# CI Quality Pipeline for yt.flow
# Generated by BMad TEA Agent - Test Architect Module
# Stack: fullstack (Python 3.12 / uv / pytest + Vite / React / Vitest)
#
# Stages: lint -> test (parallel per stack) -> burn-in (flaky detection) -> report
# ponytail: no test sharding — backend suite ~35s, frontend ~2s. Add
# pytest-xdist / vitest --shard when a single suite exceeds ~5 minutes.

name: Test Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly burn-in on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Settings() requires these (no defaults). Port 9 fails fast so the Langfuse
  # OTEL exporter cannot slow the run down; tests never reach a real backend.
  YTFLOW_LANGFUSE_HOST: http://localhost:9
  YTFLOW_LANGFUSE_PUBLIC_KEY: pk-ci
  YTFLOW_LANGFUSE_SECRET_KEY: sk-ci

jobs:
  # ── Lint stage ─────────────────────────────────────────────────────────────
  lint-backend:
    name: Lint (backend / ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check .

  lint-frontend:
    name: Lint (frontend / tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

  # ── Test stage — parallel per stack ────────────────────────────────────────
  test-backend:
    name: Test (backend / pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest -q --junitxml=test-results/pytest-junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 30

  test-frontend:
    name: Test (frontend / vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/
          retention-days: 30

  # ── Burn-in stage — flaky test detection ───────────────────────────────────
  # PR burn-in: only the test files changed by the PR run 10x. Catches
  # flakiness introduced by new/edited tests without paying full-suite cost.
  burn-in-changed:
    name: Burn-In (changed tests, 10x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate base diff

      - name: Detect changed test files
        id: changed
        env:
          # Security: inputs passed through env: to prevent script injection
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE="origin/$BASE_REF"
          PY_SPECS=$(git diff --name-only --diff-filter=d "$BASE"...HEAD | grep -E '^tests/(.*/)?test_[^/]+\.py$' || true)
          FE_SPECS=$(git diff --name-only --diff-filter=d "$BASE"...HEAD | grep -E '^frontend/src/.*\.test\.(ts|tsx)$' | sed 's|^frontend/||' || true)
          {
            echo "py<<EOF"; echo "$PY_SPECS"; echo "EOF"
            echo "fe<<EOF"; echo "$FE_SPECS"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Changed backend tests:"; echo "$PY_SPECS"
          echo "Changed frontend tests:"; echo "$FE_SPECS"

      - name: Setup uv
        if: steps.changed.outputs.py != ''
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Burn-in backend (10 iterations)
        if: steps.changed.outputs.py != ''
        run: |
          uv sync --frozen
          SPECS="${{ steps.changed.outputs.py }}"
          for i in {1..10}; do
            echo "🔥 Backend burn-in iteration $i/10"
            uv run pytest -q $SPECS || { echo "❌ Flaky: failed on iteration $i"; exit 1; }
          done

      - name: Setup Node.js
        if: steps.changed.outputs.fe != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Burn-in frontend (10 iterations)
        if: steps.changed.outputs.fe != ''
        working-directory: frontend
        run: |
          npm ci
          SPECS="${{ steps.changed.outputs.fe }}"
          for i in {1..10}; do
            echo "🔥 Frontend burn-in iteration $i/10"
            npm test -- $SPECS || { echo "❌ Flaky: failed on iteration $i"; exit 1; }
          done

  # Full-suite burn-in: every test 10x, weekly + on demand.
  burn-in-full:
    name: Burn-In (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test-backend, test-frontend]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --frozen
          cd frontend && npm ci

      - name: Run burn-in loop (10 iterations)
        run: |
          echo "🔥 Starting burn-in loop - detecting flaky tests"
          for i in {1..10}; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Burn-in iteration $i/10"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            uv run pytest -q || exit 1
            (cd frontend && npm test) || exit 1
          done
          echo "✅ Burn-in complete - no flaky tests detected"

  # ── Report stage — aggregate and publish ───────────────────────────────────
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, burn-in-changed, burn-in-full]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary
        run: |
          {
            echo "## Test Execution Summary"
            echo ""
            echo "- **Backend (pytest)**: ${{ needs.test-backend.result }}"
            echo "- **Frontend (vitest)**: ${{ needs.test-frontend.result }}"
            echo "- **Burn-in (changed)**: ${{ needs.burn-in-changed.result }}"
            echo "- **Burn-in (full)**: ${{ needs.burn-in-full.result }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.burn-in-changed.result }}" == "failure" ] || [ "${{ needs.burn-in-full.result }}" == "failure" ]; then
            echo "⚠️ **Flaky tests detected** - Review burn-in logs" >> "$GITHUB_STEP_SUMMARY"
          fi
