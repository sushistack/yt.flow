  13-2-visual-eval-axes: done  # 2026-08-11 구현 완료(커밋 e416c17+9b460d5, `spec-13-2-visual-eval-axes.md` status=done/final_revision=e416c17; 스펙은 done인데 이 줄만 review로 남아 있어 10-1c 세션이 동기화). **계측기 교체가 핵심 산출물이고 해상도 결함은 닫혔다.** ① VLM 1–5 리커트 → DSG 명제 분해(`--dsg`): 원자 명제 + 의존 그래프, 부모가 no면 자식 질문을 아예 안 던지고 불충족 처리. 같은 66프레임·같은 judge·`temperature 0`으로 재채점 → **distinct 5 → 9**, v2가 3에 몰아둔 **29행이 7개 값으로 분산돼 18행이 파일을 벗어남**, 최대 버킷 44%→27%. mean_dsg 0.5038. ② **카드 부재 교란은 기록보다 훨씬 컸다** — 10.4의 "11/66"은 재현 불가(스크립트·규칙 무기록, grep+`git log -S` 확인)이므로 폐기하고 명제로 실측: 353개 중 **163개(46%)가 사람 명제**이고 **66행 중 61행**이 최소 1개를 안고 있었다(=92%). 명제는 생성 후 제외하므로 제거량이 숫자로 남는다. ③ **VQAScore는 실측으로 기각** — DashScope compatible-mode에서 `qwen-vl-plus`는 `logprobs:true`를 줘도 `logprobs: null`, 같은 키·같은 엔드포인트의 `qwen-plus`는 완전한 top_logprobs 반환. 엔드포인트는 지원하고 비전 judge가 안 한다 → 가정 금지 지시 충족. ④ **스모크에서 계측기 결함 2건을 잡고 고쳤다(실행 전)**: (a) QG가 hand/robe/silhouette/"human figure"를 object·state로 오분류해 3/3행이 사람 명제로 채점됨 = 교란 완전 재유입 → `subject`+`about_body` 명시 단계 + 워크드 예제 2개 + `_is_person`이 두 필드의 **합집합**(정규식 금지, `gotcha_person-token-regex-is-unusable-on-image-prompt`); 잔여 불일치 42/353=12%를 `dsg_label_disagreements`로 **보고**. (b) 사람 부모가 no면 정당한 배경 명제를 무효화(실례: "사람이 이동 중인가" no → "감방 문이 열렸나" 무효) → 사람 명제는 **카드층이 공급하므로 충족 처리**하고 질문하지 않음. (c) 부수: 사람 제외 후 분모 0(3행 중 2행 unscorable) → QG에 배경층(장소+물리적 흔적) 필수화 → **unscorable 0/66**. ⑤ **기대와 반대인 결과 2건을 그대로 보고**: v2↔v3 순위상관 **0.0263**(두 계측기는 사실상 무관 — v3가 옳다는 증거는 아니고 다르다는 증거), 그리고 mean_dsg가 unreadable 프레임에서 **더 높다**(0.5694 vs 0.4892, n=12) → `readable`과 `dsg_score`는 별개 축으로 유지하고 **dsg를 게이트로 쓰지 마라**(게이트는 13-4 소관). ⑥ 축 배선: 모션 2종(state 순수함수, 항상 계산 → **tiebreak 입력**)과 시각 2종(`unreadable_rate`/`mean_dsg_score`, 유료 VLM 패스 필요 → **기록 전용, 13-4까지 승자결정 제외**). ⚠️ **모션 축은 판별기가 아니라 회귀 검출기다** — 착수 전 실측으로 확인: coverage는 건강한 런에서 **1.0으로 포화**하고 repeat_ratio는 **0.0154(1/65)**, 11.2가 씬 내부 반복을 이미 0으로 만들어 도달 가능 범위가 `[0, 0.123]`뿐. `legible` 죽은 축과 같은 형태이며 이번엔 구현 전에 잡아 독스트링에 수치째로 기록. ⑦ tiebreak 이원화(선행 결함) 통합 — `_TIEBREAK_CHAIN` 테이블 하나로 `_rule_tiebreak`(점수합산)와 `determine_winner` step3(lexicographic)을 합쳐 1-1 스플릿에서 `EvaluationResult.winner`="tie"인데 `ab_result.winner`="A"로 저장되던 불일치 제거(의도된 변경: 집계 lexicographic화 + epsilon `>0.01` 통일, 독스트링 기록). 순서는 `scene_count_match_rate`(대칭·미발동) → `cut_alignment_error`(11.4 차단 해제·승격) → `motion_repeat_ratio` → `motion_archetype_coverage` → `subtitle_sync_error`(11.4 의미반전 때문에 **강등**, 경고 삭제 아님) → `audio_duration_variance`. 전 키 `.get(key, default)` → 레거시 `ab_result` 행 재채점 무예외. ⑧ Langfuse는 **없는 키를 0.0으로 채우지 않는다** — 기존엔 `.get(metric, 0)`이 미측정 `cut_alignment_error`를 0.0으로 발행하고 있었다(레거시 dict 15→13 스코어, 테스트 갱신 사유 명시). `unreadable_rate=0.0`은 "판독불가 없음"으로 읽히므로 부재는 **키 생략**으로 표현. ⑨ **프론트 계약 정정** — 백엔드가 한 번도 쓴 적 없는 `llm_scores`/`rule_scores`·`scene_count_match`를 기대해 실데이터 전 셀이 `결과 없음`으로 렌더되던 결함 수정(`axis_scores`/`rule_based_scores` + 실제 키 8종). 픽스처가 프론트 자체 가정 형태를 써서 이걸 가리고 있었으므로 백엔드 실출력 형태로 교체 = 픽스처 자체가 회귀 가드. ⑩ 골든셋은 report-only 열 2개만 추가(`cut_alignment_error`는 scenario-only라 상수 0.0이므로 제외, 사유 주석), `compare()` 무변경. libcom 축은 8-16 backlog라 스텁·플래그·예약키 **생성 안 함**. 검증: **2642 passed / 0 failed**(신규 22건), ruff clean, 프론트 **119 passed**, 66프레임 라이브 0 error, `evaluate_ab` 소비 경로를 실제 산출물로 확인(`unreadable_rate` 0.1818=12/66, `mean_dsg_score` 0.5038). 증거·재산출 1커맨드: `_bmad-output/implementation-artifacts/13-2-live-validation/`(README에 §3 계측기 결함 2건, §5 반대 결과 2건, §6 미확립 항목). ⚠️ **인간 검증 없음**(DSG의 인간 상관은 일반 T2I 벤치마크 기준), 임계값 **의도적 미설정**(첫 분포를 본 시점에 임계값을 지어내지 않는다), `--reps 1`로 QG 분해 분산 미측정, 분모 2.9개/행으로 값이 격자형(연속값 아님). ⑪ **리뷰 반영(19건 수정, high 6)** — 전부 이 diff 안에서 해결(bad_spec 루프백 0, intent gap 0). 치명 6건: (a) `e2e/ab-comparison-accessibility.spec.ts`가 vitest 픽스처와 **똑같은** 스키마 버그를 갖고 있어 점수 셀이 전부 플레이스홀더인데도 단정이 통과 — 라이브 실행으로 확인(수정 전 그 파일 2건 실패 → 수정 후 목 테스트 통과, 남은 1건은 실파이프라인 구동 테스트로 수정 전후 동일 실패=선존). (b) `_load_visual_scores`가 최상위 list/str JSON을 그대로 반환해 `evaluate_ab` 스팬 **안에서** AttributeError → 이 파일에 의존하지도 않는 A/B 평가 전체가 죽는 경로. (c) tiebreak이 없는 키를 0.0으로 채워 **미측정 런이 그 단계를 이겼다**(lower-is-better 4종의 최선값이 0.0), 저장된 `null`엔 TypeError, NaN엔 조용히 무승부 → `_comparable`로 비교 불가 단계는 건너뜀. (d) `_cut_alignment_error`의 0.0이 '완벽 정렬'과 '잴 데이터 없음' 둘 다였다 — 11.4의 기록용일 때는 무해했으나 13.2가 체인 2순위 승자입력으로 올리자 **타이밍 데이터가 적은 런이 최우선 tiebreak을 이기는** 구조가 됐다 → `None` 반환·키 생략·단계 건너뜀. 왜곡을 옮기기만 하면 `subtitle_sync_error` 강등으로 없애려던 그 왜곡을 더 높은 우선순위에서 재현하는 셈이었다. (e) `about_body` **미검증** — `"true"`/`1`은 `is True`를 통과 못 해 몸 명제가 분모로 복귀하고, 필드가 **없으면** `_is_person`이 kind-only로 퇴화하는 동시에 `dsg_label_disagreements`가 0(=완벽 준수)으로 읽힌다 → 필수·bool 강제. 라이브 353개 전부 이미 준수하므로 **위 수치는 강화된 검증에서도 그대로 재현된다**(확인함). (f) `--dsg --limit 3`이 `visual_score.json`을 발행 — 하류는 3/66을 66/66과 구분할 수단이 없다(그냥 unreadable÷scored) → 완전 스윕에만 발행(+`--frames shots` 제외), 종료코드에 `dsg_errored` 반영. 그 외 medium 10: 시각 메트릭 타입·범위 검증(문자열 예외/1.0 초과 '비율' 발행), **epsilon을 키별로**(공유 0.01이 4개 단위를 가로질러 pct÷100의 0.6%p 차를 삼켰고 구 dataclass 경로와 실제로 불일치: 8.0% vs 8.6% → 구 점수합산 'A' / 공유-eps dict 'tie'), Langfuse 루프가 AD-10 try 안에서 `float(None)` → 이후 전 스코어(B 전량 포함) 유실 → 키 1개만 스킵, 명제 수 상한 12(무한 유료콜 방지), `dsg_qa_errors_n/total` 신설(API 실패가 mean_dsg를 내리는 것과 프레임이 실제로 못 보여주는 것을 구분 — 이번 런 0), 하네스가 HALT 판정 **전에** 산출물을 쓰던 순서 역전 + null frame 가드 + 종료코드가 판정문과 모순되지 않게, **모션 독스트링 2건이 자기 범위를 틀리게 적고 있었다** — `CAMERA_PREFERENCES`가 무드당 5종 중 **3종**만 노출하고 `_enforce_camera_variety`가 다중샷 씬에 2종 이상을 보장하므로 **0.2는 사실상 도달 불가**이고 단일 무드 건강 하한은 ~0.4–0.6이다(오독을 막으려 쓴 독스트링이 스스로 오독하고 있었다), 게다가 '판별력 없음'이라 써놓고 코드는 3·4순위 승자입력으로 쓰고 있어 coverage 0.2 스텝·repeat 1/65 스텝이 epsilon을 넘는다 → **승리의 의미를 '무드 다양성'·'씬 분할 방식'으로 정정**(모션 품질이 아니다), README §4의 헤드라인(distinct 5→9, 최대버킷 44%→27%)이 **경계 포화를 가리고 있었다 — 32/66(48%)이 0.0/1.0** → 수치 추가 + '귀속(attribution)에는 분명한 개선, 순위(ranking)에는 논쟁적'으로 정직화. low 3: `AbAxis`의 `total`(백엔드 미발행 키를 또 단정 — 고치려던 결함과 동일 부류) 제거, README §5의 '26인데 정확히 28로 재현' 자기모순 정정, §8 신설(런 이후 강화 내역 + 재현성 확인). defer 4: 골든셋 신규 열이 `aggregate_runs`에서 탈락해 **승격 판정 리포트에는 안 보임**(선존), `_motion_repeat_ratio`의 <2샷 0.0이 공허하게 최선값(I/O 계약 명시·현재 도달 불가·독스트링 기록), `determine_winner`의 `["A"]/["B"]` 직접 인덱싱(선존), UI가 방향·단위 표기 없이 8열을 나열(스펙이 명시적으로 범위 밖). 검증 재실행: **2668 passed / 0 failed**(신규 48건), ruff clean, 프론트 119 passed, Playwright 목 테스트 통과. | 2026-08-08 10-1 AC7 인계 수신(스토리 파일에 "인계: 8.16 게이트 지표가 체감을 대리하지 못한다" 절 추가): 8.16 게이트(추적 3.9px vs 정적 57.2px)는 정직하나 시청자가 보는 축이 아님을 라이브 프레임 쌍으로 확정. 축 후보 4종 + 실측 보정값 인계 — ① 플레이트가 접지면을 제공하는가(슬레이트 6장 중 2장이 바닥 없음, 접지 판정 자체 불성립) ② 접지 답이 클램프를 살아남았는가(_GROUND_Y_MAX=0.9421이 near 23/27=85% 절단, 전체 73중 34.2%; 클램프가 placement 이후라 추적오차 지표에 안 보임) ③ 카드/플레이트 빛 공유(미측정, 이번 실험 최종 잔존 결함) ④ 접촉 단서 가독성(그림자는 존재+위치 정확 +15.7휘도인데도 오려붙인 것으로 읽힘). ①②는 10-1이 이미 뽑은 데이터로 오늘 계산 가능(GPU/VLM 불필요). 방법론도 인계: video-only 재렌더는 배경이 픽셀 동일해져 off/on diff가 오버레이 정밀 계측기가 됨(대조군 밴드 필수 — 육안 오판을 정정한 실적). | 2026-08-03 스토리 파일 생성. 스코프 확정: libcom 축은 8-16 backlog + libcom 의존성 부재(grep 0건) 확인으로 epics 조건부 조항에 따라 제외(스텁 금지) → 모션 축 2종(motion_archetype_coverage/motion_repeat_ratio, camera_movement enum에서 순수 산출) + cut_alignment_error 승자결정 승격. 창출 시 발견한 선행 결함 2건을 스토리에 흡수: ① tiebreak 구현이 _rule_tiebreak(점수합산, EvaluationResult.winner 경로)와 determine_winner step3(lexicographic, 저장되는 ab_result.winner 경로)로 이원화돼 1-1 스플릿 입력에서 반환값≠저장값 → 단일 순수함수로 통합(추가보다 짧음) ② 프론트 AbResult가 rule_scores/subtitle_sync를 기대하나 백엔드는 rule_based_scores/subtitle_sync_error를 저장 → 실데이터에서 A/B 점수표가 전부 '—'(프론트 테스트가 자체 가정 픽스처를 써서 마스킹). 11-4가 eval-gate unfreeze로 이월한 subtitle_sync_error 의미반전 왜곡도 tiebreak 우선순위 강등으로 이 스토리에서 완화. 게이트 포함은 13-4 범위 — eval_prompts는 report-only 열 추가만. | eval_service judge가 나레이션 텍스트만 채점(4-2 3축) → 영상이 조잡해도 점수 불변. 규칙/도구 기반 축 추가: libcom composite score(8-16 캘리브레이션 임계값 재사용, 8-16 미착수면 나머지 축만), 모션 다양성·아키타입 커버리지(11-2 enum 분포), 컷 정렬 오차(11-4 룰메트릭 승격). 입력은 기존 런 산출물이라 GPU 재실행 불필요.
