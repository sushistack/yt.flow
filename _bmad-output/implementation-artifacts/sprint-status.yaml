  14-0-visual-asset-research-gate: done  # 2026-08-22 **미해결 5건 전부 닫힘 → 14-2/14-3/14-5 착수 금지 해제**(근거·재산출 `14-0-research-gate-closure/`, GPU 0·렌더 0·VLM 콜 0). **(1) 포즈를 자산 축으로 둔다 — Jay 결정.** 신규 삽입 모델(Kulal CVPR2023 / InsHuman) 미도입. 질문의 전제가 이미 바뀌어 있었다 — `shot_recompose_enabled: bool = True`(`config.py:468`, 10.1e가 코드 기본값까지 올림, `.env` 핀 없음)이고 recompose는 인물을 **다시 그린다**(run 4b35c0ed 33/43샷 발화), 그래서 "재포즈를 도입할까"는 지나간 질문이고 실제 질문은 "이미 도입된 재포즈가 카드에서 얼마나 벗어나도 되는가"였다. 답: 필요한 포즈의 **승인 카드를 늘린다**(14-6 소관, 기구는 10.5 ControlNet openpose 3/3 supine·기본 off + 8.4 특수 포즈 카드 + 8.20의 "텍스트 포즈 지시는 무시된다, 구조적 조건화 필요"). 기각 근거 셋: 에픽 명제가 "샷마다 생성 대신 승인된 세트에서 고른다"이므로 (b)는 샷별 생성 회귀 / `characters.angle_*_path`에 승인 게이트가 없어 정체성 드리프트가 곧 출판(`gotcha_standing-cards-have-no-approval-gate`) / 논문 VRAM은 16GB 박스 미검증(`gotcha_qwen-image-edit-rejection-was-version-specific`, 같은 오용 3회). **정체성 하한 유지 — 14-3은 이걸 느슨하게 해서 화풍 격차를 풀지 않는다.** MV-CoLight/DAEdit은 8.7 사다리 상위 대안으로 남기되 신규 모델 도입은 이 결정 밖. **(2) 어포던스 = 자산 메타데이터 + 자유생성 샷만 런타임, 판정 스키마는 하나 — Jay 결정.** 실측이 선택을 갈랐다: run 4b35c0ed는 `location_key` **31샷** / 자유생성 **12샷**이라 메타데이터만 하면 12샷 무게이트, 런타임만 하면 14-1의 존재 이유(런당 0)가 사라진다. `assess_plate_affordance.py`의 출력 계약(`standing_room`/`floor_fraction`/`camera_distance`/`best_spot`/`reason`)을 두 경로가 공유한다 — 스키마가 둘이면 14-2가 두 번 구현된다. ⚠️ **14-2는 14-1 다음이다**: `stock_plate_substitution_enabled: bool = False`(`config.py:308`)라 지금은 31샷도 플레이트를 안 쓰고, 세트가 없으면 붙일 자산이 없어 런타임 전용으로 강제되며 먼저 하면 런당 VLM 43콜 코드를 쓰고 버린다. 주의: `camera_distance`는 `camera_angle`과 어휘를 공유하지만(close-up/medium/wide) 하나는 픽셀 추정·하나는 LLM 선언이고 대조된 적이 없다. 부수 확인: 픽셀 휴리스틱 `compositing_service.ground_plane()`은 **역상관**이었다(최고 결과 S00101이 "바닥 없음", 유일 실패 S00104가 0.970) — "바닥이 읽히는가"≠"사람이 설 수 있는가". **(3) 샘플러 내부 개입은 커스텀 노드 신설 필요·미설치 — 실측.** 13.3이 커밋한 `data/comfyui/env-snapshot.json`의 커스텀 노드 10종 전량(IC-Light/IPAdapter_plus/Inspyrenet-Rembg/rembg/Custom-Scripts/Manager/GGUF/impact-pack/controlnet_aux/websocket_image_save) 중 샘플링 시점 어텐션 개입 제공은 0건이고, 코어(`f350a842`)에도 Attend-and-Excite 구현이 없다(유일 문자열 히트는 `qw