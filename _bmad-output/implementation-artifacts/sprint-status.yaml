 0 failed**(신규 48건), ruff clean, 프론트 119 passed, Playwright 목 테스트 통과. | 2026-08-08 10-1 AC7 인계 수신(스토리 파일에 "인계: 8.16 게이트 지표가 체감을 대리하지 못한다" 절 추가): 8.16 게이트(추적 3.9px vs 정적 57.2px)는 정직하나 시청자가 보는 축이 아님을 라이브 프레임 쌍으로 확정. 축 후보 4종 + 실측 보정값 인계 — ① 플레이트가 접지면을 제공하는가(슬레이트 6장 중 2장이 바닥 없음, 접지 판정 자체 불성립) ② 접지 답이 클램프를 살아남았는가(_GROUND_Y_MAX=0.9421이 near 23/27=85% 절단, 전체 73중 34.2%; 클램프가 placement 이후라 추적오차 지표에 안 보임) ③ 카드/플레이트 빛 공유(미측정, 이번 실험 최종 잔존 결함) ④ 접촉 단서 가독성(그림자는 존재+위치 정확 +15.7휘도인데도 오려붙인 것으로 읽힘). ①②는 10-1이 이미 뽑은 데이터로 오늘 계산 가능(GPU/VLM 불필요). 방법론도 인계: video-only 재렌더는 배경이 픽셀 동일해져 off/on diff가 오버레이 정밀 계측기가 됨(대조군 밴드 필수 — 육안 오판을 정정한 실적). | 2026-08-03 스토리 파일 생성. 스코프 확정: libcom 축은 8-16 backlog + libcom 의존성 부재(grep 0건) 확인으로 epics 조건부 조항에 따라 제외(스텁 금지) → 모션 축 2종(motion_archetype_coverage/motion_repeat_ratio, camera_movement enum에서 순수 산출) + cut_alignment_error 승자결정 승격. 창출 시 발견한 선행 결함 2건을 스토리에 흡수: ① tiebreak 구현이 _rule_tiebreak(점수합산, EvaluationResult.winner 경로)와 determine_winner step3(lexicographic, 저장되는 ab_result.winner 경로)로 이원화돼 1-1 스플릿 입력에서 반환값≠저장값 → 단일 순수함수로 통합(추가보다 짧음) ② 프론트 AbResult가 rule_scores/subtitle_sync를 기대하나 백엔드는 rule_based_scores/subtitle_sync_error를 저장 → 실데이터에서 A/B 점수표가 전부 '—'(프론트 테스트가 자체 가정 픽스처를 써서 마스킹). 11-4가 eval-gate unfreeze로 이월한 subtitle_sync_error 의미반전 왜곡도 tiebreak 우선순위 강등으로 이 스토리에서 완화. 게이트 포함은 13-4 범위 — eval_prompts는 report-only 열 추가만. | eval_service judge가 나레이션 텍스트만 채점(4-2 3축) → 영상이 조잡해도 점수 불변. 규칙/도구 기반 축 추가: libcom composite score(8-16 캘리브레이션 임계값 재사용, 8-16 미착수면 나머지 축만), 모션 다양성·아키타입 커버리지(11-2 enum 분포), 컷 정렬 오차(11-4 룰메트릭 승격). 입력은 기존 런 산출물이라 GPU 재실행 불필요.
