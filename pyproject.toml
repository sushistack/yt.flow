[project]
name = "yt-flow"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.7",
    "langgraph-checkpoint-sqlite==3.1.0",
    "aiosqlite>=0.20",
    "fastapi==0.138.2",
    "sqlmodel==0.0.39",
    "alembic>=1,<2",
    "langfuse==4.12.0",
    "pydantic-settings==2.14.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=0.24",
    "ruff==0.15.20",
    "httpx2>=0.28",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.coverage.run]
source = ["yt_flow"]

[tool.coverage.report]
# Exit Criteria (test-design-qa.md): coverage >=80% on services/, pipeline/, api/.
# Gated on the whole package rather than three separate scoped runs — simpler,
# and the three directories currently sit well above 80% individually anyway.
fail_under = 80
skip_covered = false
